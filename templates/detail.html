{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="container my-5">
    <div class="row">

        <!-- IMAGE -->
        <div class="col-md-6">
            <img src="{% static 'images/' %}{{ bien.image }}" class="img-fluid rounded shadow">
        </div>

        <!-- INFOS -->
        <div class="col-md-6">
            <h2>{{ bien.titre }}</h2>
            <h4 class="text-success">{{ bien.prix }}</h4>

            <p class="mt-3">{{ bien.details }}</p>

            <a href="https://wa.me/221771234567" class="btn btn-success mt-3">
                <i class="fab fa-whatsapp"></i> Contacter sur WhatsApp
            </a>
        </div>

    </div>
</section>

{% endblock %}
